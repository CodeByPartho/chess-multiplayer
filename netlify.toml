[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: /join/<id> and /invite/<code> are client routes — the
# dev server (vite) does this automatically, Netlify needs it explicitly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers. The CSP was verified clean against a production build
# served with these exact headers (home, vs-computer engine, queue/realtime,
# puzzles, sign-in) before it was flipped from report-only to enforcing — see
# README → Security for the rationale and the response-header story.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; font-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# The engine ships as a single-threaded Stockfish WASM build, which needs no
# SharedArrayBuffer — so no Cross-Origin-Embedder-Policy is set. If the engine
# is ever switched to a multi-threaded build, COEP: require-corp becomes
# necessary and every cross-origin asset (e.g. Supabase images) must then send
# Cross-Origin-Resource-Policy headers.
